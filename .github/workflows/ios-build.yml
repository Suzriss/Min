name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x install found on this runner. Available Xcode installs:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile AppIcon.icon with actool
        run: |
          mkdir -p build/icon-verify
          xcrun actool AppIcon.icon \
            --compile build/icon-verify \
            --output-format human-readable-text \
            --notices --warnings --errors \
            --app-icon AppIcon \
            --include-all-app-icons \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device iphone \
            --target-device ipad \
            --minimum-deployment-target 18.0 \
            --platform iphoneos \
            --output-partial-info-plist build/icon-verify/partial-info.plist
          echo "---- actool compiled output (build/icon-verify) ----"
          find build/icon-verify -maxdepth 2 -exec ls -la {} \;

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Min.xcodeproj \
            -scheme Min \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found under build/DerivedData/Build/Products"
            exit 1
          fi
          echo "Packaging $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -r Min-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Min-unsigned-ipa
          path: build/Min-unsigned.ipa
